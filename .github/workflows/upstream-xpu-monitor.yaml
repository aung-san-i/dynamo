# Watches the XPU test runs in upstream ai-dynamo/dynamo and reports what they
# really mean.
#
# Read-only. It reads upstream's public run history, job logs and JUnit test
# reports, and writes this run's job summary plus one artifact holding the
# upstream logs it read. Nothing is pushed anywhere, and no secret is needed:
# the default GITHUB_TOKEN can read a public repo.
#
# For every failed XPU job the summary shows a link to the job's log page,
# the causes found in the log, and the tests that failed. The test list comes
# from the job's JUnit report artifact (kept 7 days upstream). If that cannot
# be read, it comes from pytest's "short test summary info" lines in the log.
# A "Failing tests" table then counts how many runs each test failed in: one
# test failing across many PRs points at main or a flaky test, one failing in
# a single PR points at that PR.
#
# Upstream's green or red badge often says nothing about XPU
# (see XPU-CI-FAILURE-REPORT.md). So every upstream run is put in one group:
#   tested-fail  an XPU build or test job failed. The cause is read from its log.
#   tested-pass  the XPU build and test jobs ran, and the run passed.
#   not-tested   green, but every XPU job was skipped: the PR has no `xpu`
#                label (guard), or no core/vLLM file changed (changed-files).
#   file-error   0 jobs. GitHub could not read a branch's copy of the workflow
#                file, so nothing was tested and nothing failed.
#   other        failed or cancelled for a reason outside the XPU build and
#                test jobs, e.g. a job that never got a runner.
#   running      still in progress. Only seen in a manual run with `hours` set.
# xpu-status-check is never blamed. It only repeats the result of the jobs
# before it.
name: Upstream XPU monitor

on:
  schedule:
    # 00:23, 06:23, 12:23 and 18:23 UTC. Off-round minute on purpose: GitHub
    # delays cron that fires exactly on the hour, when everyone else's jobs are
    # queued.
    - cron: "23 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Look back this many hours from now instead of the scheduled 6 h slot. Keep it under about 48: every run costs one API call against a 1000-per-hour limit."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: upstream-xpu-monitor
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ai-dynamo/dynamo
  SLOT_SECONDS: 21600
  LOGS_ARTIFACT: upstream-xpu-logs-${{ github.run_id }}

defaults:
  run:
    shell: bash

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pick the time window
        id: window
        env:
          HOURS: ${{ inputs.hours }}
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          if [ -n "${HOURS}" ]; then
            case "${HOURS}" in
              *[!0-9]*) echo "::error::hours must be a whole number, got '${HOURS}'"; exit 1 ;;
            esac
            start=$(( now - HOURS * 3600 ))
            end="${now}"
          else
            # The 6 h slot that ENDED one full slot ago. Its runs have had at
            # least 6 h to finish. Each scheduled run takes the next slot, so a
            # run that starts late neither skips runs nor reports them twice.
            end=$(( now / SLOT_SECONDS * SLOT_SECONDS - SLOT_SECONDS ))
            start=$(( end - SLOT_SECONDS ))
          fi
          fmt() { date -u -d "@$1" +%Y-%m-%dT%H:%M:%SZ; }
          # created=A..B includes both ends, so stop one second short of the
          # next slot's start.
          echo "range=$(fmt "${start}")..$(fmt $(( end - 1 )))" >> "$GITHUB_OUTPUT"

      - name: Sort upstream XPU runs into groups
        env:
          GH_TOKEN: ${{ github.token }}
          RANGE: ${{ steps.window.outputs.range }}
        run: |
          set -euo pipefail
          R="${UPSTREAM_REPO}"
          rows="${RUNNER_TEMP}/rows.tsv"   # group, workflow, run, branch, detail
          tests="${RUNNER_TEMP}/tests.tsv" # test, workflow, run, branch
          : > "${rows}"
          : > "${tests}"
          # Every log and JUnit report read below is kept here, and the next
          # step uploads the folder as this run's artifact.
          logs="${RUNNER_TEMP}/upstream-xpu-logs"
          mkdir -p "${logs}"
          # At most this many failed tests are listed per job; the rest are
          # counted as "+N more".
          MAX_TESTS=10

          # The XPU build and test jobs. When PR-XPU calls xpu-ci.yaml they are
          # named "xpu-ci-vllm / build-xpu" and so on. cleanup-xpu is left out
          # on purpose: it tests nothing, so its failure lands in "other".
          XPU_JOB='(^|/ )(build-xpu|test-xpu[A-Za-z0-9-]*)$'

          # Every known cause found in a failed job's log, from the causes in
          # XPU-CI-FAILURE-REPORT.md. One log can hold several.
          cause() {
            local log="$1" m found=()
            if m="$(grep -m1 -oE "No module named '[^']+'" "${log}")"; then
              found+=("module missing from the XPU image: ${m}")
            fi
            if grep -q 'auditwheel: command not found' "${log}"; then
              found+=("auditwheel missing from the wheel build")
            fi
            if grep -q 'Address already in use' "${log}"; then
              found+=("port collision: Address already in use")
            fi
            if m="$(grep -m1 -oE 'Timeout >[0-9.]+s' "${log}")"; then
              found+=("pytest timeout: ${m}")
            fi
            if m="$(grep -m1 -oE "unexpected keyword argument '[^']+'" "${log}")"; then
              found+=("API change: ${m}")
            fi
            if grep -qE 'Temporary failure in name resolution|TLS handshake timeout|i/o timeout|net/http: request canceled' "${log}"; then
              found+=("network trouble on the XPU runner")
            fi
            if [ "${#found[@]}" -eq 0 ]; then
              # Job log lines start with a timestamp; drop it.
              m="$(grep -m1 -E '##\[error\]|Error:|FAILED ' "${log}" \
                | sed -E 's/^[0-9]{4}-[0-9T:.-]+Z //' | cut -c1-200 || true)"
              found+=("unclassified: ${m:-no error line found}")
            fi
            local IFS=';'
            echo "${found[*]}"
          }

          # The failed tests and the result tally of one job. Prints one line
          # per item, "kind<TAB>test<TAB>reason", where kind is FAILED, ERROR
          # or TALLY. Both readers below name a test the way JUnit does,
          # "tests.serve.test_vllm::test_agg[qwen]", so the "Failing tests"
          # table counts a test once whichever reader found it.

          # The JUnit XML files in folder $1, written by upstream's pytest
          # action (--junitxml). Exact names and messages, no log scraping.
          junit_tests() {
            python3 -I - "$1" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET

          def one_line(text):
              text = " ".join((text or "").split())
              return text[:150]

          tests = failures = errors = skipped = 0
          for path in sorted(pathlib.Path(sys.argv[1]).rglob("*.xml")):
              root = ET.parse(path).getroot()
              for suite in root.iter("testsuite"):
                  tests += int(suite.get("tests", 0))
                  failures += int(suite.get("failures", 0))
                  errors += int(suite.get("errors", 0))
                  skipped += int(suite.get("skipped", 0))
              for case in root.iter("testcase"):
                  # A collection error has an empty classname and the module
                  # in name.
                  cls, name = case.get("classname", ""), case.get("name", "")
                  test = f"{cls}::{name}" if cls else name
                  for kind in ("failure", "error"):
                      bad = case.find(kind)
                      if bad is not None:
                          reason = bad.get("message") or bad.text
                          print(f"{'FAILED' if kind == 'failure' else 'ERROR'}\t{test}\t{one_line(reason)}")
          if tests:
              passed = tests - failures - errors - skipped
              print(f"TALLY\t\t{failures} failed, {errors} errors, {passed} passed, {skipped} skipped (JUnit)")
          PY
          }

          # tests/serve/test_vllm.py::TestA::test_b[x] -> tests.serve.test_vllm.TestA::test_b[x]
          junit_name() {
            local id="$1" path rest name mid
            path="${id%%::*}"
            rest="${id#"${path}"}"
            rest="${rest#::}"
            path="${path%.py}"
            path="${path//\//.}"
            if [ -z "${rest}" ]; then
              echo "${path}"
              return
            fi
            name="${rest##*::}"
            mid="${rest%"${name}"}"
            mid="${mid%::}"
            echo "${path}${mid:+.${mid//::/.}}::${name}"
          }

          # Log $1, when no JUnit report can be read. pytest runs with -v, so
          # it ends with a "short test summary info" block of
          # "FAILED tests/x.py::test_y - reason" lines and a
          # "== 2 failed, 39 passed in 790s ==" tally. The .py in the pattern
          # keeps out vLLM's own "ERROR 10-28 12:00:00 ..." log lines.
          log_tests() {
            local log="$1" line kind id reason tally
            sed -E 's/^[0-9]{4}-[0-9T:.-]+Z //' "${log}" \
              | { grep -E '^(FAILED|ERROR) [^ ]+\.py(::[^ ]+)?( - .*)?$' || true; } \
              | sort -u \
              | while read -r kind line; do
                  id="${line%% - *}"
                  reason=""
                  [ "${id}" = "${line}" ] || reason="${line#* - }"
                  printf '%s\t%s\t%s\n' "${kind}" "$(junit_name "${id}")" "${reason:0:150}"
                done
            tally="$(sed -E 's/^[0-9]{4}-[0-9T:.-]+Z //' "${log}" \
              | grep -E '^=+ .*[0-9]+ (passed|failed|errors?|skipped|deselected).* in [0-9.]+s.* =+$' \
              | tail -n1 | sed -E 's/^=+ //; s/ =+$//' || true)"
            if [ -n "${tally}" ]; then
              printf 'TALLY\t\t%s (log)\n' "${tally}"
            fi
          }

          # Reasons are shown inside the summary's HTML table, where "<x>" in
          # e.g. "assert <x> == 1" would vanish as an unknown tag. The
          # replacements are quoted: since bash 5.2 a bare & in one means
          # "the matched text".
          html_escape() {
            local amp='&amp;' lt='&lt;' gt='&gt;' s
            s="${1//&/"${amp}"}"
            s="${s//</"${lt}"}"
            echo "${s//>/"${gt}"}"
          }

          # A | would end the table cell, e.g. in test_kv[a|b]. Quoted for
          # the same bash 5.2 reason: inside a command argument, \\| loses its
          # backslash.
          md_cell() {
            local bar='\|'
            echo "${1//|/"${bar}"}"
          }

          # A job or test name made safe for a file name inside an artifact.
          safe_name() {
            echo "${1//[^A-Za-z0-9._-]/-}"
          }

          # $1 group, $2 workflow, $3 run link, $4 branch, $5 detail
          add() {
            local detail="${5//|/\\|}"
            printf '%s\t%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$4" "${detail//$'\t'/ }" >> "${rows}"
          }

          classify() {
            local wf="$1" id="$2" status="$3" concl="$4" branch="$5" url="$6"
            local ref="[${id}](${url})" jobs n ran failed detail=""
            if [[ "${branch}" =~ ^pull-request/([0-9]+)$ ]]; then
              branch="[PR #${BASH_REMATCH[1]}](https://github.com/${R}/pull/${BASH_REMATCH[1]})"
            fi

            if [ "${status}" != "completed" ]; then
              add running "${wf}" "${ref}" "${branch}" "status ${status}"
              return
            fi

            # A post-merge run has about 90 jobs. Listing them can take GitHub
            # over 10 s, and then it may drop the request (HTTP 502). Small
            # pages are quicker to build. Retry a few times, and if it still
            # fails, report this run instead of stopping the whole report.
            local try
            jobs=""
            for try in 1 2 3; do
              if jobs="$(gh api --paginate "repos/${R}/actions/runs/${id}/jobs?per_page=30" \
                  --jq '.jobs[] | {id, name, conclusion, runner_name, html_url}' | jq -s .)"; then
                break
              fi
              jobs=""
              if [ "${try}" -lt 3 ]; then
                sleep 10
              fi
            done
            if [ -z "${jobs}" ]; then
              add other "${wf}" "${ref}" "${branch}" "job list not available (GitHub API error)"
              return
            fi
            n="$(jq length <<<"${jobs}")"

            if [ "${n}" -eq 0 ]; then
              if [ "${concl}" = "failure" ]; then
                add file-error "${wf}" "${ref}" "${branch}" "0 jobs: GitHub could not read the workflow file on this branch"
              else
                add other "${wf}" "${ref}" "${branch}" "0 jobs, conclusion ${concl}"
              fi
              return
            fi

            failed="$(jq -c --arg re "${XPU_JOB}" \
              '.[] | select((.name | test($re)) and (.conclusion == "failure" or .conclusion == "timed_out"))' <<<"${jobs}")"
            if [ -n "${failed}" ]; then
              local jid jname jconcl jurl base log list src arts aid aname
              local kind test reason n total tally
              # This run's JUnit report artifacts, "id<TAB>name". Read once
              # per run, and only for a run with a failed XPU job.
              arts="$(gh api --paginate "repos/${R}/actions/runs/${id}/artifacts?per_page=100" \
                --jq '.artifacts[] | select((.expired | not) and (.name | startswith("test-results-"))) | [.id, .name] | @tsv' \
                2>/dev/null || true)"
              while read -r j; do
                jid="$(jq -r .id <<<"${j}")"
                jname="$(jq -r .name <<<"${j}")"
                jconcl="$(jq -r .conclusion <<<"${j}")"
                # The job's log page. Not the /logs API URL: that redirects
                # to a signed download that expires in about a minute.
                jurl="$(jq -r '.html_url // empty' <<<"${j}")"
                base="${logs}/${id}-${jid}-$(safe_name "${jname}")"
                log="${base}.log"
                detail+="**${jname}** (${jconcl})${jurl:+ [log](${jurl})}: "
                if gh api "repos/${R}/actions/jobs/${jid}/logs" > "${log}" 2>/dev/null; then
                  detail+="$(cause "${log}")<br>"
                else
                  rm -f "${log}"
                  detail+="log not available<br>"
                fi

                # Upstream's pytest action names its artifact
                # test-results-...-<run id>-<check run id>, and a job's check
                # run id is its job id. A job can hold several such reports.
                list="${base}.tests.tsv"
                : > "${list}"
                src=""
                while IFS=$'\t' read -r aid aname; do
                  [ -n "${aid}" ] && [[ "${aname}" == *"-${jid}" ]] || continue
                  mkdir -p "${base}-junit/${aid}"
                  if gh api "repos/${R}/actions/artifacts/${aid}/zip" > "${base}-junit/${aid}.zip" 2>/dev/null \
                      && unzip -o -q "${base}-junit/${aid}.zip" -d "${base}-junit/${aid}"; then
                    src=junit
                  fi
                  rm -f "${base}-junit/${aid}.zip"
                done <<<"${arts}"
                if [ "${src}" = junit ]; then
                  if ! junit_tests "${base}-junit" > "${list}" || [ ! -s "${list}" ]; then
                    src=""
                  fi
                fi
                if [ -z "${src}" ] && [ -f "${log}" ]; then
                  log_tests "${log}" > "${list}"
                  src=log
                fi

                if [ -s "${list}" ]; then
                  n=0
                  total="$(awk -F'\t' '$1 != "TALLY"' "${list}" | wc -l)"
                  while IFS=$'\t' read -r kind test reason; do
                    [ "${kind}" != TALLY ] || continue
                    # The detail's | are escaped later by add(); the
                    # "Failing tests" rows do not go through add().
                    printf '%s\t%s\t%s\t%s\n' "$(md_cell "${test}")" "${wf}" "${ref}" "${branch}" >> "${tests}"
                    n=$(( n + 1 ))
                    if [ "${n}" -le "${MAX_TESTS}" ]; then
                      detail+="${kind} \`${test}\`${reason:+ - $(html_escape "${reason}")}<br>"
                    fi
                  done < "${list}"
                  if [ "${total}" -gt "${MAX_TESTS}" ]; then
                    detail+="+$(( total - MAX_TESTS )) more failed tests, all listed in this run's log artifact<br>"
                  fi
                  tally="$(awk -F'\t' '$1 == "TALLY" { print $3 }' "${list}")"
                  if [ -n "${tally}" ]; then
                    detail+="pytest: ${tally}<br>"
                  fi
                fi
              done <<<"${failed}"
              add tested-fail "${wf}" "${ref}" "${branch}" "${detail}"
              return
            fi

            # Checked after the failed XPU jobs: a run is often cancelled
            # (e.g. a newer commit landed) after an XPU test already failed.
            if [ "${concl}" = "cancelled" ]; then
              detail="$(jq -r '[.[] | select(.conclusion == "cancelled" and (.runner_name // "") == "") | .name] | join(", ")' <<<"${jobs}")"
              add other "${wf}" "${ref}" "${branch}" \
                "run cancelled${detail:+; never got a runner: ${detail}}"
              return
            fi

            ran="$(jq -r --arg re "${XPU_JOB}" \
              '[.[] | select((.name | test($re)) and .conclusion != "skipped")] | length' <<<"${jobs}")"

            if [ "${concl}" = "success" ] && [ "${ran}" -gt 0 ]; then
              detail="$(jq -r --arg re "${XPU_JOB}" \
                '[.[] | select((.name | test($re)) and .conclusion == "success") | .name | sub("^.*/ "; "")] | join(", ")' <<<"${jobs}")"
              add tested-pass "${wf}" "${ref}" "${branch}" "passed: ${detail}"
              return
            fi

            if [ "${concl}" = "success" ]; then
              if jq -e '.[] | select(.name == "changed-files" and .conclusion == "skipped")' <<<"${jobs}" >/dev/null; then
                detail="no xpu label: guard skipped every later job"
              else
                detail="no core or vLLM file changed: changed-files skipped the XPU jobs"
              fi
              add not-tested "${wf}" "${ref}" "${branch}" "${detail}"
              return
            fi

            # Failed, but no XPU build or test job failed.
            detail="$(jq -r '[.[] | select(.name != "xpu-status-check" and (.name | endswith("/ xpu-status-check") | not)
                                     and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"))
                              | "\(.name) (\(.conclusion))"] | join(", ")' <<<"${jobs}")"
            add other "${wf}" "${ref}" "${branch}" \
              "conclusion ${concl}; ${detail:-every job passed but the run is marked ${concl}}"
          }

          for wf in pr-xpu.yaml post-merge-ci.yml nightly-ci.yml xpu-ci.yaml; do
            gh api --paginate "repos/${R}/actions/workflows/${wf}/runs?created=${RANGE}&per_page=100" \
              --jq '.workflow_runs[] | [.id, .status, (.conclusion // "-"), .head_branch, .html_url] | @tsv' \
            | while IFS=$'\t' read -r id status concl branch url; do
                classify "${wf}" "${id}" "${status}" "${concl}" "${branch}" "${url}"
              done
          done

          count() { awk -F'\t' -v g="$1" '$1 == g' "${rows}" | wc -l; }
          table() {
            echo "| Workflow | Run | Branch | Detail |"
            echo "|---|---|---|---|"
            awk -F'\t' -v g="$1" '$1 == g { printf "| %s | %s | %s | %s |\n", $2, $3, $4, $5 }' "${rows}"
          }

          {
            echo "## Upstream XPU runs in ${R}, created ${RANGE} UTC"
            echo
            if [ -n "$(ls -A "${logs}")" ]; then
              echo "Every upstream job log and JUnit report read for this summary is in the artifact \`${LOGS_ARTIFACT}\` at the bottom of [this run's page](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}), kept 30 days."
              echo
            fi
            echo "| Group | Runs |"
            echo "|---|---|"
            for g in tested-fail tested-pass not-tested file-error other running; do
              echo "| ${g} | $(count "${g}") |"
            done
            for g in tested-fail other file-error tested-pass running; do
              [ "$(count "${g}")" -gt 0 ] || continue
              echo
              echo "### ${g}"
              echo
              table "${g}"
              if [ "${g}" = tested-fail ] && [ -s "${tests}" ]; then
                echo
                echo "### Failing tests"
                echo
                echo "Runs each test failed in. Many unrelated PRs: main or a flaky test. One PR: that PR."
                echo
                echo "| Test | Runs | Where |"
                echo "|---|---|---|"
                # A test that fails in two jobs of one run counts once.
                sort -u -t $'\t' -k1,1 -k3,3 "${tests}" \
                  | awk -F'\t' '
                      { n[$1]++; where[$1] = where[$1] (n[$1] > 1 ? "<br>" : "") $3 " " $4 }
                      END { for (t in n) printf "%d\t| `%s` | %d | %s |\n", n[t], t, n[t], where[t] }' \
                  | sort -t $'\t' -k1,1nr -k2,2 | cut -f2-
              fi
            done
            if [ "$(count not-tested)" -gt 0 ]; then
              echo
              echo "<details><summary>not-tested: green, but no XPU job ran</summary>"
              echo
              table not-tested
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail this run when an upstream XPU build or test job failed, so
          # GitHub sends its usual failure email. The summary above is
          # already written.
          fails="$(count tested-fail)"
          if [ "${fails}" -gt 0 ]; then
            echo "::error::${fails} upstream run(s) with a failed XPU build or test job in ${RANGE} UTC. See the job summary."
            exit 1
          fi

      # always(): the step above fails on purpose when an upstream XPU job
      # failed, which is exactly when these logs are wanted. Upstream deletes
      # its logs after 90 days and its JUnit reports after 7.
      - name: Keep the upstream logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ env.LOGS_ARTIFACT }}
          path: ${{ runner.temp }}/upstream-xpu-logs/
          retention-days: 30
          if-no-files-found: ignore
