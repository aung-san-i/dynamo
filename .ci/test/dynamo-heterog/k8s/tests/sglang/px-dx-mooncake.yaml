# px-dx-mooncake Test (sglang): XPU Prefill + XPU Decode on ONE node, KV over Mooncake
# The sglang counterpart of vllm/px-dx-mooncake.yaml: dynamo.sglang with
# --disaggregation-transfer-backend mooncake, so the prefill worker pushes each
# request's KV to the decode worker with sglang's own Mooncake transfer engine
# (TENT over each pod's own RDMA NIC). Needs Mooncake built for XPU into the image
# (Dockerfile.dynamo_xpu does it for the sglang chain too).
# A post-run check proves the KV moved through Mooncake: both workers loaded the
# Mooncake engine, prefill computed the prompts, decode generated from received KV,
# and no transfer failed.
# Transfers are serialized (SGLANG_DISAGGREGATION_THREAD_POOL_SIZE/QUEUE_SIZE=1),
# the equivalent of vllm's num_workers: 1: across pods TENT stages through a fixed
# host pool that concurrent senders exhaust ("No available stage buffer").
# ${NVIDIA_NODE} places the bench Job only; it claims no device.
#
# Both workers name the same ${XPU_RESOURCE_TEMPLATE}: one ResourceClaim per pod,
# so each gets one card of the pair and its own NIC. The template must be
# `count: 1` over a pool of >=2 cards (onexpu-rdma-vf-kueue here). TP stays 1.
#
# Usage by hand:
#   export DOCKER_IMAGE_XPU="..." DOCKER_IMAGE_GPU="..." XPU_RESOURCE_TEMPLATE="..." XPU_NODE="..." NVIDIA_NODE="..."
#   export TEST_NAME="sglang-px-dx-mooncake" MODEL="" TENSOR_PARALLEL=""
#   kubectl apply -f <(envsubst < px-dx-mooncake.yaml) -n dynamo-system
#
# Cleanup:
#   kubectl delete -f <(envsubst < px-dx-mooncake.yaml) -n dynamo-system
---
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: ${TEST_NAME}
  namespace: dynamo-system
spec:
  backendFramework: sglang
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      extraPodMetadata:
        labels:
          kueue.x-k8s.io/queue-name: dynamo-queue
          kueue.x-k8s.io/pod-group-name: ${TEST_NAME}
        annotations:
          kueue.x-k8s.io/pod-group-total-count: "3"
      extraPodSpec:
        nodeSelector:
          dynamo.intel.com/node: ${XPU_NODE}
        imagePullSecrets:
          - name: amr-caas-registry
        volumes:
          - name: pytorch-models
            hostPath:
              path: /software/data/pytorch
              type: Directory
          - name: weka-models
            hostPath:
              path: /mnt/weka
              type: Directory
        mainContainer:
          image: ${DOCKER_IMAGE_XPU}
          env:
            - name: DYN_STORE_KV
              value: "mem"
            - name: DYN_REQUEST_PLANE
              value: "tcp"
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/hub
            - name: PYTHONHASHSEED
              value: "0"
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
          volumeMounts:
            - name: pytorch-models
              mountPath: /models
            - name: weka-models
              mountPath: /mnt/weka
              readOnly: true

    Prefill:
      componentType: worker
      replicas: 1
      extraPodMetadata:
        labels:
          kueue.x-k8s.io/queue-name: dynamo-queue
          kueue.x-k8s.io/pod-group-name: ${TEST_NAME}
        annotations:
          kueue.x-k8s.io/pod-group-total-count: "3"
      extraPodSpec:
        nodeSelector:
          dynamo.intel.com/node: ${XPU_NODE}
        imagePullSecrets:
          - name: amr-caas-registry
        volumes:
          - name: pytorch-models
            hostPath:
              path: /software/data/pytorch
              type: Directory
          - name: weka-models
            hostPath:
              path: /mnt/weka
              type: Directory
        # One card + one NIC per pod from the shared template; the other worker's
        # claim necessarily takes the other card of the pair.
        resourceClaims:
          - name: intel-gpu-rdma-resource
            resourceClaimTemplateName: ${XPU_RESOURCE_TEMPLATE}
        mainContainer:
          image: ${DOCKER_IMAGE_XPU}
          workingDir: /workspace
          command:
            - /bin/bash
            - -c
            - |
              # The image sets oneAPI up only in its ENTRYPOINT, which command: bypasses.
              source /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1 || true
              export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
              xpu-smi discovery || true
              # The workers need no proxy (model is local, peers are pod IPs); unset it
              # so no bootstrap or handshake hop can be sent to proxy-dmz.
              unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY
              # Empty --disaggregation-ib-device = Mooncake auto-discovers the HCAs,
              # and dranet has put exactly this pod's NIC in its netns.
              python -m dynamo.sglang \
                --model-path ${MODEL:-Qwen/Qwen3-0.6B} \
                --tp-size ${TENSOR_PARALLEL:-1} \
                --device xpu \
                --attention-backend intel_xpu \
                --dtype bfloat16 \
                --page-size 64 \
                --mem-fraction-static 0.7 \
                --disaggregation-mode prefill \
                --disaggregation-bootstrap-port 12345 \
                --disaggregation-transfer-backend mooncake \
                --host 0.0.0.0
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_PTRACE"
                - "SYS_ADMIN"
                - "SYS_RAWIO"
          env:
            - name: MODEL
              value: "$MODEL"
            - name: TENSOR_PARALLEL
              value: "$TENSOR_PARALLEL"
            - name: DYN_STORE_KV
              value: "mem"
            - name: DYN_REQUEST_PLANE
              value: "tcp"
            - name: PYTHONHASHSEED
              value: "0"
            # Advertised as the bootstrap host (prefill) and the transfer engine's
            # session host (both): the pod IP, not whatever NIC autodetection picks.
            - name: SGLANG_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MOONCAKE_PROTOCOL
              value: "rdma"
            - name: MC_USE_TENT
              value: "1"
            - name: RDMAV_FORK_SAFE
              value: "1"
            - name: SGLANG_DISAGGREGATION_THREAD_POOL_SIZE
              value: "1"
            - name: SGLANG_DISAGGREGATION_QUEUE_SIZE
              value: "1"
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/hub
            - name: HF_HUB_OFFLINE
              value: "0"
          resources:
            claims:
              - name: intel-gpu-rdma-resource
          volumeMounts:
            - name: pytorch-models
              mountPath: /models
            - name: weka-models
              mountPath: /mnt/weka
              readOnly: true

    Decode:
      componentType: worker
      replicas: 1
      extraPodMetadata:
        labels:
          kueue.x-k8s.io/queue-name: dynamo-queue
          kueue.x-k8s.io/pod-group-name: ${TEST_NAME}
        annotations:
          kueue.x-k8s.io/pod-group-total-count: "3"
      extraPodSpec:
        nodeSelector:
          dynamo.intel.com/node: ${XPU_NODE}
        imagePullSecrets:
          - name: amr-caas-registry
        volumes:
          - name: pytorch-models
            hostPath:
              path: /software/data/pytorch
              type: Directory
          - name: weka-models
            hostPath:
              path: /mnt/weka
              type: Directory
        # One card + one NIC per pod from the shared template; the other worker's
        # claim necessarily takes the other card of the pair.
        resourceClaims:
          - name: intel-gpu-rdma-resource
            resourceClaimTemplateName: ${XPU_RESOURCE_TEMPLATE}
        mainContainer:
          image: ${DOCKER_IMAGE_XPU}
          workingDir: /workspace
          command:
            - /bin/bash
            - -c
            - |
              # The image sets oneAPI up only in its ENTRYPOINT, which command: bypasses.
              source /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1 || true
              export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
              xpu-smi discovery || true
              # The workers need no proxy (model is local, peers are pod IPs); unset it
              # so no bootstrap or handshake hop can be sent to proxy-dmz.
              unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY
              # Empty --disaggregation-ib-device = Mooncake auto-discovers the HCAs,
              # and dranet has put exactly this pod's NIC in its netns.
              python -m dynamo.sglang \
                --model-path ${MODEL:-Qwen/Qwen3-0.6B} \
                --tp-size ${TENSOR_PARALLEL:-1} \
                --device xpu \
                --attention-backend intel_xpu \
                --dtype bfloat16 \
                --page-size 64 \
                --mem-fraction-static 0.7 \
                --disaggregation-mode decode \
                --disaggregation-bootstrap-port 12345 \
                --disaggregation-transfer-backend mooncake \
                --host 0.0.0.0
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_PTRACE"
                - "SYS_ADMIN"
                - "SYS_RAWIO"
          env:
            - name: MODEL
              value: "$MODEL"
            - name: TENSOR_PARALLEL
              value: "$TENSOR_PARALLEL"
            - name: DYN_STORE_KV
              value: "mem"
            - name: DYN_REQUEST_PLANE
              value: "tcp"
            - name: PYTHONHASHSEED
              value: "0"
            # Advertised as the bootstrap host (prefill) and the transfer engine's
            # session host (both): the pod IP, not whatever NIC autodetection picks.
            - name: SGLANG_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MOONCAKE_PROTOCOL
              value: "rdma"
            - name: MC_USE_TENT
              value: "1"
            - name: RDMAV_FORK_SAFE
              value: "1"
            - name: SGLANG_DISAGGREGATION_THREAD_POOL_SIZE
              value: "1"
            - name: SGLANG_DISAGGREGATION_QUEUE_SIZE
              value: "1"
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/hub
            - name: HF_HUB_OFFLINE
              value: "0"
          resources:
            claims:
              - name: intel-gpu-rdma-resource
          volumeMounts:
            - name: pytorch-models
              mountPath: /models
            - name: weka-models
              mountPath: /mnt/weka
              readOnly: true

# Post-run verification, executed on the runner by the template's "Post-run server
# log parser" step (post_run_server_log_check: true). TEST_NAME is substituted at
# deploy time; NS defaults to dynamo-system.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${TEST_NAME}-post-run-checks
  namespace: dynamo-system
data:
  verify.sh: |
    #!/usr/bin/env bash
    # Verifies from the worker pods that the KV went prefill -> decode over sglang's
    # Mooncake transfer engine. Exit 0 = pass, non-zero = fail.
    set -uo pipefail
    TEST_NAME="${TEST_NAME:?TEST_NAME must be set by the caller}"
    NS="${NS:-dynamo-system}"
    echo "========================================="
    echo "sglang Mooncake P/D verification (runner)"
    echo "========================================="
    PODS=$(kubectl get pods -n "$NS" -l nvidia.com/dynamo-graph-deployment-name="$TEST_NAME" -o name 2>/dev/null)
    P_POD=$(echo "$PODS" | grep -i prefill | head -n1)
    D_POD=$(echo "$PODS" | grep -i decode | head -n1)
    if [ -z "$P_POD" ] || [ -z "$D_POD" ]; then
      echo "ERROR: could not locate the prefill and decode pods"; echo "$PODS"; exit 1
    fi
    echo "Prefill pod: $P_POD"; echo "Decode pod: $D_POD"
    PLOG=$(mktemp); DLOG=$(mktemp)
    kubectl logs -n "$NS" "$P_POD" --all-containers=true --tail=50000 > "$PLOG" 2>&1 || { echo "ERROR: cannot read $P_POD logs"; exit 1; }
    kubectl logs -n "$NS" "$D_POD" --all-containers=true --tail=50000 > "$DLOG" 2>&1 || { echo "ERROR: cannot read $D_POD logs"; exit 1; }

    # A worker "uses Mooncake" when one of its processes has the mooncake engine
    # module mapped. sglang logs nothing on a successful transfer, so this plus the
    # scheduler lines below is the evidence; sglang fails the request if KV never lands.
    mooncake_loaded() {
      kubectl exec -n "$NS" "$1" -- sh -c \
        'grep -l -i "mooncake" /proc/[0-9]*/maps 2>/dev/null | head -n1' 2>/dev/null | grep -q maps
    }
    P_MC=false; D_MC=false
    mooncake_loaded "$P_POD" && P_MC=true
    mooncake_loaded "$D_POD" && D_MC=true

    # Prefill in disagg-prefill mode logs "Prefill batch ... #new-token: N ... #bootstrap-req";
    # decode in disagg-decode mode logs "Decode batch ... #transfer-req".
    P_NEW=$(grep -E "Prefill batch.*#bootstrap-req" "$PLOG" | grep -oE "#new-token: [0-9]+" | grep -oE '[0-9]+' | awk '{s+=$1} END {printf "%d", s+0}')
    D_BATCHES=$(grep -cE "Decode batch.*#transfer-req" "$DLOG" || true)
    FAIL_RE="Decode transfer failed|KVTransferError|Mooncake Transfer Engine initialization failed|No available stage buffer|Traceback"
    FAILS=$(cat "$PLOG" "$DLOG" | grep -cE "$FAIL_RE" || true)

    echo "--- scheduler lines (OBSERVED, last 5 each) ---"
    grep -E "Prefill batch" "$PLOG" | tail -5 || true
    grep -E "Decode batch" "$DLOG" | tail -5 || true

    # Pass criteria:
    #  1) both workers loaded the Mooncake transfer engine
    #  2) prefill computed prompt tokens in disagg-prefill mode   (sum #new-token > 0)
    #  3) decode generated in disagg-decode mode                 (Decode batch lines with #transfer-req)
    #  4) no transfer failure or traceback on either worker
    engine_ok=false; prefill_ok=false; decode_ok=false; clean_ok=false
    [ "$P_MC" = true ] && [ "$D_MC" = true ] && engine_ok=true
    [ "$P_NEW" -gt 0 ] && prefill_ok=true
    [ "${D_BATCHES:-0}" -gt 0 ] && decode_ok=true
    [ "${FAILS:-0}" -eq 0 ] && clean_ok=true

    echo ""
    echo "=== sglang Mooncake P/D verification (EXPECTED vs OBSERVED) ==="
    echo "[1/4] Mooncake engine on both workers  EXPECTED loaded on P and D        OBSERVED P=$P_MC D=$D_MC  -> $engine_ok"
    echo "[2/4] Prefill computed the prompts     EXPECTED sum #new-token > 0        OBSERVED $P_NEW  -> $prefill_ok"
    echo "[3/4] Decode generated from KV         EXPECTED Decode batch lines > 0    OBSERVED ${D_BATCHES:-0}  -> $decode_ok"
    echo "[4/4] No transfer failures             EXPECTED 0 lines /$FAIL_RE/        OBSERVED ${FAILS:-0}  -> $clean_ok"
    echo "================================================================"
    if [ "$engine_ok" = true ] && [ "$prefill_ok" = true ] && [ "$decode_ok" = true ] && [ "$clean_ok" = true ]; then
      echo "sglang Mooncake P/D test PASSED"; exit 0
    fi
    echo "ERROR: sglang Mooncake P/D test FAILED (engine_ok=$engine_ok prefill_ok=$prefill_ok decode_ok=$decode_ok clean_ok=$clean_ok)"
    echo "--- worker lines mentioning Mooncake/TENT/errors (for triage) ---"
    cat "$PLOG" "$DLOG" | grep -iE "mooncake|tent|transfer.*(fail|error)|$FAIL_RE" | tail -40 || true
    exit 1
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${TEST_NAME}-bench
  namespace: dynamo-system
  labels:
    kueue.x-k8s.io/queue-name: dynamo-queue
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: dynamo-queue
        app.kubernetes.io/name: ${TEST_NAME}-bench
        app.kubernetes.io/part-of: sglang-px-dx-mooncake
    spec:
      restartPolicy: Never
      serviceAccountName: ${TEST_NAME}-k8s-service-discovery
      # Deliberately NOT the XPU node: the bench client runs from the GPU image
      # and claims no accelerator, which leaves both XPU cards to the workers.
      nodeSelector:
        dynamo.intel.com/node: ${NVIDIA_NODE}
      imagePullSecrets:
        - name: amr-caas-registry
      volumes:
        - name: pytorch-models
          hostPath:
            path: /software/data/pytorch
            type: Directory
        - name: weka-models
          hostPath:
            path: /mnt/weka
            type: Directory
      containers:
        - name: benchmark-runner
          image: ${DOCKER_IMAGE_GPU}
          workingDir: /workspace
          command:
            - /bin/sh
            - -c
            - |
              FRONTEND_HOST="${TEST_NAME}-frontend.dynamo-system.svc.cluster.local"

              # The model this Job benchmarks. MODEL is empty when the workflow
              # passes no model input, so this test's own default is applied here,
              # by the shell, where `:-` means something -- envsubst does not
              # implement it. The result is held under a DIFFERENT name because
              # every `$MODEL` in this script is substituted at render time (MODEL
              # is in envsubst's variable list) and would arrive already empty;
              # `$MODEL_PATH` is not in that list, so it survives to the shell.
              MODEL_PATH="${MODEL:-Qwen/Qwen3-0.6B}"

              # Files for the run artifact go in $ARTIFACT_DIR; save_artifacts
              # prints them into this pod's log between @@ci-artifact markers (the
              # workflow cuts them back out into bench/<name>) on every exit path,
              # and again right after the curl test (a SIGKILL later would run no
              # trap).
              ARTIFACT_DIR=/tmp/ci-artifacts
              mkdir -p "$ARTIFACT_DIR"
              save_artifacts() {
                for f in "$ARTIFACT_DIR"/*; do
                  [ -f "$f" ] || continue
                  name=$(basename "$f")
                  case "$name" in
                    *.png)
                      # Binary: base64 here, decoded by the workflow.
                      echo "@@ci-artifact-begin-b64 $name"
                      base64 "$f"
                      ;;
                    *)
                      echo "@@ci-artifact-begin $name"
                      cat "$f"
                      # An end marker glued onto an unterminated last line is lost.
                      if [ -n "$(tail -c1 "$f")" ]; then echo; fi
                      ;;
                  esac
                  echo "@@ci-artifact-end $name"
                done
              }
              trap save_artifacts EXIT
              trap 'save_artifacts; exit 143' TERM INT

              echo "========================================="
              echo "Endpoint and FrontEnd Health Check"
              echo "========================================="

              # Wait for all worker endpoints (prefill, decode) for this deployment
              echo "Waiting for all worker endpoints (prefill, decode) to be registered..."
              timeout_sec=600
              poll_sec=30
              max_attempts=$((timeout_sec / poll_sec))
              workers_ready=false
              for attempt in $(seq 1 "$max_attempts"); do
                # ?instances=true: Dynamo >= #16454 lists endpoints only on request;
                # older frontends ignore the query.
                health_response=$(curl --noproxy '*' -sS "http://${FRONTEND_HOST}:${FRONTEND_PORT}/health?instances=true" 2>/dev/null || echo "")

                # Check for both required workers for px-dx deployment
                # Note: decode worker with --disaggregation-mode decode still registers as backend.generate
                has_prefill=$(echo "$health_response" | grep -c "${TEST_NAME}.*prefill.generate" || true)
                has_decode=$(echo "$health_response" | grep -c "${TEST_NAME}.*backend.generate" || true)
                frontend_status=$(echo "$health_response" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")

                if [ "$has_prefill" -gt 0 ] && [ "$has_decode" -gt 0 ] && [ "$frontend_status" = "healthy" ]; then
                  echo "All worker endpoints registered (attempt ${attempt}/${max_attempts})"
                  echo "Registered endpoints for px-dx:"
                  echo "$health_response" | grep "${TEST_NAME}" | grep -E "prefill.generate|backend.generate" || true
                  workers_ready=true
                  break
                fi
                echo "Attempt ${attempt}/${max_attempts}: waiting for all workers"
                echo "Status: prefill=$has_prefill, decode=$has_decode"
                sleep "$poll_sec"
              done

              if [ "$workers_ready" != "true" ]; then
                echo "ERROR: timeout waiting for all worker endpoints"
                echo "Final status: prefill=$has_prefill, decode=$has_decode, frontend_status=$frontend_status"
                echo "Final health check response:"
                curl --noproxy '*' -sS "http://${FRONTEND_HOST}:${FRONTEND_PORT}/health?instances=true" || true
                exit 1
              fi

              # Wait for model to be discoverable via /v1/models before starting benchmark to avoid test instability
              echo "========================================="
              echo "Model Registration Check"
              echo "========================================="

              model_ready=false
              timeout_sec=180
              poll_sec=15
              max_attempts=$((timeout_sec / poll_sec))
              for attempt in $(seq 1 "$max_attempts"); do
                if curl --noproxy '*' -sf "http://${FRONTEND_HOST}:${FRONTEND_PORT}/v1/models" 2>/dev/null | grep -Fq '"id":"'; then
                  echo "Model registration check passed (attempt ${attempt}/${max_attempts})"
                  model_ready=true
                  break
                fi
                echo "Attempt ${attempt}/${max_attempts}: model not registered yet"
                sleep "$poll_sec"
              done

              if [ "$model_ready" != "true" ]; then
                echo "ERROR: timeout waiting for model registration"
                curl --noproxy '*' -sS "http://${FRONTEND_HOST}:${FRONTEND_PORT}/v1/models" || true
                exit 1
              fi

              # Redirect curl test output to separate log file (and console)
              {
                echo "========================================="
                echo "Curl Smoke Test - $(date)"
                echo "========================================="
                echo ""

                echo "--- /v1/models ---"
                curl --noproxy '*' -sS "http://${FRONTEND_HOST}:${FRONTEND_PORT}/v1/models"
                echo ""

                echo "--- /v1/completions (text-only with retry) ---"
              } 2>&1 | tee "$ARTIFACT_DIR/curl_test.log"

              # One variable on the wire and in the log, so they cannot drift.
              # Closed factual prefix, not an open instruction, so the answer
              # is checkable on content: the continuation has to say Paris.
              # Greedy, as in px-dn: a sampled curl is one frozen draw (engine
              # seed 0) that grades the sampler, not the KV transfer.
              ENDPOINT="http://${FRONTEND_HOST}:${FRONTEND_PORT}/v1/completions"
              REQUEST_BODY="{
                \"model\": \"${MODEL_PATH}\",
                \"prompt\": \"The capital city of France is\",
                \"max_tokens\": 256,
                \"temperature\": 0
              }"
              echo "--- request sent to the frontend ---"
              {
                echo "endpoint: POST $ENDPOINT"
                echo "request body:"
                printf '%s\n' "$REQUEST_BODY"
              } | tee "$ARTIFACT_DIR/input-prompt-curl-req.log"

              # Prose half is reference only, for whoever reads the artifact; the
              # expected-keywords: line is what the quality check enforces.
              {
                echo ""
                echo "sample-expected-response:"
                echo " Paris. Paris is the largest city in France and its political, economic and cultural centre, sitting on the river Seine in the north of the country."
                echo ""
                echo "expected-keywords: min 1 of Paris"
              } >> "$ARTIFACT_DIR/input-prompt-curl-req.log"
              echo "sample-expected-response and expected-keywords appended to $ARTIFACT_DIR/input-prompt-curl-req.log"

              text_success=false
              text_timeout=180
              text_interval=15
              text_max_attempts=$((text_timeout / text_interval))
              {
                for attempt in $(seq 1 "$text_max_attempts"); do
                  echo "Text completion request attempt ${attempt}/${text_max_attempts}..."
                  response=$(curl --noproxy '*' -sS -X POST "$ENDPOINT" \
                    -H "Content-Type: application/json" \
                    -d "$REQUEST_BODY" 2>&1)

                  echo "$response"
                  # The response body itself, not just the transcript, so the
                  # artifact carries something machine-readable. Last attempt wins.
                  printf '%s\n' "$response" > "$ARTIFACT_DIR/curl_response.json"

                  # Check if response contains error indicators
                  if echo "$response" | grep -qE 'Service Unavailable|Connection refused|error'; then
                    echo "Text completion attempt ${attempt} failed (service not ready), retrying in ${text_interval}s..."
                    sleep "$text_interval"
                  else
                    echo "Text completion request completed (attempt ${attempt}/${text_max_attempts})"
                    text_success=true
                    break
                  fi
                done

                if [ "$text_success" != "true" ]; then
                  echo "WARNING: text completion curl request failed after ${text_max_attempts} attempts"
                fi
                echo ""
                echo "Curl smoke test complete"
              } 2>&1 | tee -a "$ARTIFACT_DIR/curl_test.log"

              echo ""
              echo "========================================="
              echo "Curl test completed (logs saved to $ARTIFACT_DIR/curl_test.log)"
              echo "========================================="
              save_artifacts

              echo "========================================="
              echo "Running sglang PX-DX-MOONCAKE Benchmark (Prefill and Decode on two cards of one XPU host, KV over Mooncake)"
              echo "========================================="
              echo ""
              echo "Configuration:"
              echo "  FRONTEND_HOST: $FRONTEND_HOST"
              echo "  FRONTEND_PORT: ${FRONTEND_PORT}"
              echo "  MODEL: ${MODEL_PATH}"
              echo "  ISL: ${ISL}"
              echo "  OSL: ${OSL}"
              echo "  CONC: ${CONC}"
              echo "  NUM_PROMPTS: ${NUM_PROMPTS}"
              echo "  REQUEST_RATE: ${REQUEST_RATE}"
              echo ""

              # sglang images carry no vLLM, so the load comes from sglang's own
              # client. random-ids needs no dataset download (HF_HUB_OFFLINE=1);
              # range ratio 1 fixes ISL/OSL like vllm's random dataset.
              BENCH_OUT=/tmp/bench_result.jsonl
              rm -f "$BENCH_OUT"
              python3 -m sglang.bench_serving \
                --backend sglang-oai \
                --base-url "http://$FRONTEND_HOST:$FRONTEND_PORT" \
                --model "$MODEL_PATH" \
                --tokenizer "$MODEL_PATH" \
                --dataset-name random-ids \
                --random-input-len "$ISL" \
                --random-output-len "$OSL" \
                --random-range-ratio 1 \
                --num-prompts "$NUM_PROMPTS" \
                --max-concurrency "$CONC" \
                --request-rate "$REQUEST_RATE" \
                --output-file "$BENCH_OUT" \
                --disable-tqdm || { echo "ERROR: sglang.bench_serving exited non-zero"; exit 1; }

              # bench_serving prints no failed-request count, so check it here:
              # every prompt must have completed.
              completed=$(python3 -c "import json,sys; print(json.loads(open(sys.argv[1]).readlines()[-1])['completed'])" "$BENCH_OUT" 2>/dev/null || echo 0)
              echo "Completed requests: ${completed}/${NUM_PROMPTS}"
              if [ "$completed" != "$NUM_PROMPTS" ]; then
                echo "ERROR: only ${completed} of ${NUM_PROMPTS} requests completed"
                exit 1
              fi

              echo ""
              echo "========================================="
              echo "Benchmark Complete"
              echo "========================================="
          env:
            - name: FRONTEND_PORT
              value: "8000"
            - name: MODEL
              value: "$MODEL"
            - name: ISL
              value: "1024"
            - name: OSL
              value: "256"
            - name: CONC
              value: "8"
            - name: NUM_PROMPTS
              value: "100"
            - name: REQUEST_RATE
              value: "inf"
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/hub
            - name: HF_HUB_OFFLINE
              value: "0"
          volumeMounts:
            - name: pytorch-models
              mountPath: /models
            - name: weka-models
              mountPath: /mnt/weka
              readOnly: true
