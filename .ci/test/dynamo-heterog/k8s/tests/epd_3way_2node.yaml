# epd_3way_2node Test: XPU Encode + NVIDIA Prefill + NVIDIA Decode (3-way on 2 nodes)
# Uses DynamoGraphDeployment with DRA (Dynamic Resource Allocation)
# Uses pre-existing ResourceClaimTemplates: ${XPU_RESOURCE_TEMPLATE} and ${NVIDIA_RESOURCE_TEMPLATE}
#
# NODE CAPACITY: Prefill and Dec both claim ${NVIDIA_RESOURCE_TEMPLATE} on
# ${NVIDIA_NODE}, so that node must satisfy the template TWICE -- two GPUs and
# two RDMA devices. The node has one cabled port, which only one pod can hold,
# so xpu-heterogeneous-run.yml passes onenvidia-rdma-vf-kueue: each worker gets
# its own SR-IOV VF of that port. A run claims 3 RDMA devices in total (Enc's
# XPU-node port + 2 VFs), so Kueue's intel.com/rdma quota must be at least 3.
#
# Usage:
#   export DOCKER_IMAGE_XPU="..." DOCKER_IMAGE_GPU="..." XPU_RESOURCE_TEMPLATE="..." NVIDIA_RESOURCE_TEMPLATE="..."
#   kubectl apply -f <(envsubst < epd_3way_2node.yaml) -n dynamo-system
#   kubectl wait --for=condition=Ready pod -l dynamo.nvidia.com/graph=epd-3way-2node -n dynamo-system --timeout=10m
#
# Cleanup:
#   kubectl delete -f epd_3way_2node.yaml -n dynamo-system
---
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: ${TEST_NAME}
  namespace: dynamo-system
spec:
  backendFramework: vllm
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      extraPodMetadata:
        labels:
          kueue.x-k8s.io/queue-name: dynamo-queue
          kueue.x-k8s.io/pod-group-name: ${TEST_NAME}
        annotations:
          kueue.x-k8s.io/pod-group-total-count: "4"
      extraPodSpec:
        nodeSelector:
          dynamo.intel.com/node: ${NVIDIA_NODE}
        imagePullSecrets:
          - name: amr-caas-registry
        volumes:
          - name: pytorch-models
            hostPath:
              path: /software/data/pytorch
              type: Directory
          - name: weka-models
            hostPath:
              path: /mnt/weka
              type: Directory
        mainContainer:
          image: ${DOCKER_IMAGE_GPU}
          env:
            - name: DYN_STORE_KV
              value: "mem"
            - name: DYN_REQUEST_PLANE
              value: "tcp"
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/hub
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
            - name: PYTHONHASHSEED
              value: "0"
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
          volumeMounts:
            - name: pytorch-models
              mountPath: /models
            - name: weka-models
              mountPath: /mnt/weka
              readOnly: true

    Enc:
      componentType: worker
      replicas: 1
      extraPodMetadata:
        labels:
          kueue.x-k8s.io/queue-name: dynamo-queue
          kueue.x-k8s.io/pod-group-name: ${TEST_NAME}
        annotations:
          kueue.x-k8s.io/pod-group-total-count: "4"
      extraPodSpec:
        nodeSelector:
          dynamo.intel.com/node: ${XPU_NODE}
        imagePullSecrets:
          - name: amr-caas-registry
        volumes:
          - name: pytorch-models
            hostPath:
              path: /software/data/pytorch
              type: Directory
          - name: weka-models
            hostPath:
              path: /mnt/weka
              type: Directory
        resourceClaims:
          - name: intel-gpu-rdma-resource
            resourceClaimTemplateName: ${XPU_RESOURCE_TEMPLATE}
        mainContainer:
          image: ${DOCKER_IMAGE_XPU}
          workingDir: /workspace
          command:
            - /bin/sh
            - -c
            - |
              xpu-smi discovery || true
              TRANSFER_LOCAL=0 \
              python -m dynamo.vllm \
                --model ${MODEL:-Qwen/Qwen3-VL-8B-Instruct} \
                --enable-multimodal \
                --disaggregation-mode encode \
                --enable-mm-embeds \
                --dtype bfloat16 \
                --enforce-eager \
                --block-size 64 \
                --gpu-memory-utilization 0.95 \
                --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}' \
                --kv-transfer-config '{"kv_connector":"NixlConnector", "kv_role":"kv_both", "kv_buffer_device":"xpu", "kv_connector_extra_config": {"enforce_handshake_compat": false}}'
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_PTRACE"
                - "SYS_ADMIN"
                - "SYS_RAWIO"
          env:
            - name: MODEL
              value: "$MODEL"
            - name: DYN_STORE_KV
              value: "mem"
            - name: DYN_REQUEST_PLANE
              value: "tcp"
            - name: DYN_VLLM_KV_EVENT_PORT
              value: "20080"
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "20098"
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PYTHONHASHSEED
              value: "0"
            - name: DYN_VLLM_EMBEDDING_TRANSFER_MODE
              value: "nixl-read"
            - name: ENABLE_ENCODER_CACHE
              value: "0"
            - name: VISION_ENCODE_SERIALIZE
              value: "1"
            - name: NIXL_USE_CPU_HOST_MEMORY
              value: "0"
            - name: UCX_TLS
              value: "ib,rc,ud,rc_verbs,ud_verbs,ze_copy"
            - name: UCX_IB_ROCE_REACHABILITY_MODE
              value: "all"
            # RoCE GID 1 = the RoCE v2 GID of the link-local IPv6 (fe80) address,
            # which every up interface has. A VF loses its IPv4 address after a
            # test uses it (dranet moves it out and back, and nothing re-applies
            # a hand-set address), leaving only GIDs 0/1; Prefill on such a VF
            # then failed to reach Enc's IPv4 GID (ibv_create_ah ... sgid_index=1
            # dgid=::ffff:192.180.180.10: Invalid argument). Same index on every
            # NIXL worker here so both ends of each connection use fe80 GIDs.
            - name: UCX_IB_GID_INDEX
              value: "1"
            - name: UCX_MEMTYPE_CACHE
              value: "0"
            # vLLM 0.30 reads telemetry on every completed transfer, so it must be on
            # (the operator injects ENABLE=n) -- but with an empty EXPORTER: its
            # prometheus is a plugin neither image builds, and loading it throws.
            - name: NIXL_TELEMETRY_ENABLE
              value: "y"
            - name: NIXL_TELEMETRY_EXPORTER
              value: ""
            # Since dynamo #14474 its media client refuses a fetch through the proxy without this.
            - name: DYN_MM_TRUST_EGRESS_PROXY
              value: "1"
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/hub
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
            # V2 model runner's _dummy_run has no mm_encoder_only guard, so profiling
            # executes the language model whose weights are Meta tensors in
            # --disaggregation-mode=encode (rms_norm has no Meta kernel).
            - name: VLLM_USE_V2_MODEL_RUNNER
              value: "0"
          resources:
            claims:
              - name: intel-gpu-rdma-resource
          volumeMounts:
            - name: pytorch-models
              mountPath: /models
            - name: weka-models
              mountPath: /mnt/weka
              readOnly: true

    Prefill:
      componentType: worker
      replicas: 1
      extraPodMetadata:
        labels:
          kueue.x-k8s.io/queue-name: dynamo-queue
          kueue.x-k8s.io/pod-group-name: ${TEST_NAME}
        annotations:
          kueue.x-k8s.io/pod-group-total-count: "4"
      extraPodSpec:
        nodeSelector:
          dynamo.intel.com/node: ${NVIDIA_NODE}
        imagePullSecrets:
          - name: amr-caas-registry
        volumes:
          - name: pytorch-models
            hostPath:
              path: /software/data/pytorch
              type: Directory
          - name: weka-models
            hostPath:
              path: /mnt/weka
              type: Directory
        resourceClaims:
          - name: gpu-rdma-prefill-resource
            resourceClaimTemplateName: ${NVIDIA_RESOURCE_TEMPLATE}
        mainContainer:
          image: ${DOCKER_IMAGE_GPU}
          workingDir: /workspace
          command:
            - /bin/sh
            - -c
            - |
              TRANSFER_LOCAL=0 \
              python -m dynamo.vllm \
                --model ${MODEL:-Qwen/Qwen3-VL-8B-Instruct} \
                --enable-multimodal \
                --enable-mm-embeds \
                --route-to-encoder \
                --disaggregation-mode prefill \
                --mm-prompt-template "<|im_start|>system\nYou are a helpful assistant.<|im_end|>\n<|im_start|>user\n<|vision_start|><|image_pad|><|vision_end|><prompt><|im_end|>\n<|im_start|>assistant\n" \
                --dtype bfloat16 \
                --enforce-eager \
                --block-size 64 \
                --gpu-memory-utilization 0.95 \
                --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:32080","enable_kv_cache_events":true}' \
                --kv-transfer-config '{"kv_connector":"NixlConnector", "kv_role":"kv_both", "kv_buffer_device":"cuda", "kv_connector_extra_config": {"enforce_handshake_compat": false}}'
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_PTRACE"
                - "SYS_ADMIN"
                - "SYS_RAWIO"
          env:
            - name: MODEL
              value: "$MODEL"
            - name: DYN_STORE_KV
              value: "mem"
            - name: DYN_REQUEST_PLANE
              value: "tcp"
            - name: DYN_VLLM_KV_EVENT_PORT
              value: "32080"
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "32098"
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_NIXL_DEVICE_TO_DEVICE
              value: "1"
            - name: UCX_TLS
              value: "ib,rc,ud,cuda_ipc,cuda_copy"
            - name: UCX_IB_ROCE_REACHABILITY_MODE
              value: "all"
            # RoCE GID 1 = the RoCE v2 GID of the link-local IPv6 (fe80) address,
            # which every up interface has. A VF loses its IPv4 address after a
            # test uses it (dranet moves it out and back, and nothing re-applies
            # a hand-set address), leaving only GIDs 0/1; Prefill on such a VF
            # then failed to reach Enc's IPv4 GID (ibv_create_ah ... sgid_index=1
            # dgid=::ffff:192.180.180.10: Invalid argument). Same index on every
            # NIXL worker here so both ends of each connection use fe80 GIDs.
            - name: UCX_IB_GID_INDEX
              value: "1"
            - name: UCX_MEMTYPE_CACHE
              value: "0"
            # vLLM 0.30 reads telemetry on every completed transfer, so it must be on
            # (the operator injects ENABLE=n) -- but with an empty EXPORTER: its
            # prometheus is a plugin neither image builds, and loading it throws.
            - name: NIXL_TELEMETRY_ENABLE
              value: "y"
            - name: NIXL_TELEMETRY_EXPORTER
              value: ""
            - name: DYN_VLLM_EMBEDDING_TRANSFER_MODE
              value: "nixl-read"
            - name: PYTHONHASHSEED
              value: "0"
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/hub
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
            # HND: FlashInfer on Blackwell rejects NHD under vLLM 0.30.
            - name: VLLM_KV_CACHE_LAYOUT
              value: "HND"
            - name: VLLM_EXPONENTIAL_BUCKETING
              value: "false"
            - name: VLLM_DEEP_GEMM_WARMUP
              value: "skip"
          resources:
            claims:
              - name: gpu-rdma-prefill-resource
          volumeMounts:
            - name: pytorch-models
              mountPath: /models
            - name: weka-models
              mountPath: /mnt/weka
              readOnly: true

    Dec:
      componentType: worker
      replicas: 1
      extraPodMetadata:
        labels:
          kueue.x-k8s.io/queue-name: dynamo-queue
          kueue.x-k8s.io/pod-group-name: ${TEST_NAME}
        annotations:
          kueue.x-k8s.io/pod-group-total-count: "4"
      extraPodSpec:
        nodeSelector:
          dynamo.intel.com/node: ${NVIDIA_NODE}
        imagePullSecrets:
          - name: amr-caas-registry
        volumes:
          - name: pytorch-models
            hostPath:
              path: /software/data/pytorch
              type: Directory
          - name: weka-models
            hostPath:
              path: /mnt/weka
              type: Directory
        resourceClaims:
          - name: gpu-rdma-decode-resource
            resourceClaimTemplateName: ${NVIDIA_RESOURCE_TEMPLATE}
        mainContainer:
          image: ${DOCKER_IMAGE_GPU}
          workingDir: /workspace
          command:
            - /bin/sh
            - -c
            - |
              # Wait for Prefill's download before starting. Prefill and Dec share
              # ${NVIDIA_NODE}'s HF cache (/software/data/pytorch -> /models), and on
              # a model's first run both download it at once: Prefill holds the
              # blob lock and Dec's downloader fails on it instead of waiting
              # ("Lock acquisition failed: .../blobs/<hash>.lock") -- CrashLoopBackOff,
              # which the template's readiness wait fails on at once.
              #   complete (index + every shard it lists, folder not growing) -> start
              #   folder still growing (Prefill downloading)                  -> wait
              #   no growth for 120s and not complete (nobody downloading)    -> start,
              #     and let this worker download it itself, as before
              #   45 min                                                     -> start anyway
              # M, not MODEL: envsubst fills in a bare MODEL reference at render
              # time, before this shell runs; the :- default form survives it.
              M="${MODEL:-Qwen/Qwen3-VL-8B-Instruct}"
              D="${HF_HOME:-/models/huggingface}/hub/models--$(echo "$M" | sed 's|/|--|g')"
              waited=0; still=0; prev=-1
              while :; do
                now=$(du -sk "$D" 2>/dev/null | cut -f1); now=${now:-0}
                if [ "$now" = "$prev" ]; then still=$((still + 10)); else still=0; fi
                prev=$now
                if [ "$still" -gt 0 ] && python -c 'import glob, json, os, sys
              for s in glob.glob(os.path.join(sys.argv[1], "snapshots", "*")):
                  i = os.path.join(s, "model.safetensors.index.json")
                  if os.path.isfile(os.path.join(s, "config.json")) and os.path.isfile(i):
                      if all(os.path.isfile(os.path.join(s, f)) for f in set(json.load(open(i))["weight_map"].values())):
                          sys.exit(0)
              sys.exit(1)' "$D"; then
                  echo "$M is fully downloaded in $D (${now} KiB); starting after ${waited}s"
                  break
                fi
                if [ "$still" -ge 120 ]; then
                  echo "$M not complete and not growing for ${still}s (${now} KiB); starting, this worker downloads it"
                  break
                fi
                if [ "$waited" -ge 2700 ]; then
                  echo "Gave up waiting for $M after ${waited}s (${now} KiB); starting anyway"
                  break
                fi
                echo "Waiting for $M to finish downloading: ${now} KiB in $D (${waited}s)"
                sleep 10; waited=$((waited + 10))
              done
              TRANSFER_LOCAL=0 \
              python -m dynamo.vllm \
                --model ${MODEL:-Qwen/Qwen3-VL-8B-Instruct} \
                --enable-multimodal \
                --enable-mm-embeds \
                --disaggregation-mode decode \
                --mm-prompt-template "<|im_start|>system\nYou are a helpful assistant.<|im_end|>\n<|im_start|>user\n<|vision_start|><|image_pad|><|vision_end|><prompt><|im_end|>\n<|im_start|>assistant\n" \
                --dtype bfloat16 \
                --enforce-eager \
                --block-size 64 \
                --gpu-memory-utilization 0.95 \
                --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:33080","enable_kv_cache_events":true}' \
                --kv-transfer-config '{"kv_connector":"NixlConnector", "kv_role":"kv_both", "kv_buffer_device":"cuda", "kv_connector_extra_config": {"enforce_handshake_compat": false}}'
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_PTRACE"
                - "SYS_ADMIN"
                - "SYS_RAWIO"
          env:
            - name: MODEL
              value: "$MODEL"
            - name: DYN_STORE_KV
              value: "mem"
            - name: DYN_REQUEST_PLANE
              value: "tcp"
            - name: DYN_VLLM_KV_EVENT_PORT
              value: "33080"
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "33098"
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: UCX_TLS
              value: "ib,rc,ud,cuda_ipc,cuda_copy"
            - name: UCX_IB_ROCE_REACHABILITY_MODE
              value: "all"
            # RoCE GID 1 = the RoCE v2 GID of the link-local IPv6 (fe80) address,
            # which every up interface has. A VF loses its IPv4 address after a
            # test uses it (dranet moves it out and back, and nothing re-applies
            # a hand-set address), leaving only GIDs 0/1; Prefill on such a VF
            # then failed to reach Enc's IPv4 GID (ibv_create_ah ... sgid_index=1
            # dgid=::ffff:192.180.180.10: Invalid argument). Same index on every
            # NIXL worker here so both ends of each connection use fe80 GIDs.
            - name: UCX_IB_GID_INDEX
              value: "1"
            - name: UCX_MEMTYPE_CACHE
              value: "0"
            # vLLM 0.30 reads telemetry on every completed transfer, so it must be on
            # (the operator injects ENABLE=n) -- but with an empty EXPORTER: its
            # prometheus is a plugin neither image builds, and loading it throws.
            - name: NIXL_TELEMETRY_ENABLE
              value: "y"
            - name: NIXL_TELEMETRY_EXPORTER
              value: ""
            - name: DYN_VLLM_EMBEDDING_TRANSFER_MODE
              value: "nixl-read"
            - name: PYTHONHASHSEED
              value: "0"
            - name: ENABLE_ENCODER_CACHE
              value: "0"
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/hub
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
            # HND: FlashInfer on Blackwell rejects NHD under vLLM 0.30.
            - name: VLLM_KV_CACHE_LAYOUT
              value: "HND"
            - name: VLLM_EXPONENTIAL_BUCKETING
              value: "false"
            - name: VLLM_DEEP_GEMM_WARMUP
              value: "skip"
          resources:
            claims:
              - name: gpu-rdma-decode-resource
          volumeMounts:
            - name: pytorch-models
              mountPath: /models
            - name: weka-models
              mountPath: /mnt/weka
              readOnly: true

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${TEST_NAME}-bench
  namespace: dynamo-system
  labels:
    kueue.x-k8s.io/queue-name: dynamo-queue
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${TEST_NAME}-bench
        app.kubernetes.io/part-of: epd-3way-2node
        kueue.x-k8s.io/queue-name: dynamo-queue
    spec:
      restartPolicy: Never
      nodeSelector:
        dynamo.intel.com/node: ${NVIDIA_NODE}
      imagePullSecrets:
        - name: amr-caas-registry
      volumes:
        - name: pytorch-models
          hostPath:
            path: /software/data/pytorch
            type: Directory
        - name: weka-models
          hostPath:
            path: /mnt/weka
            type: Directory
      containers:
        - name: benchmark-runner
          image: ${DOCKER_IMAGE_GPU}
          workingDir: /workspace
          command:
            - /bin/sh
            - -c
            - |
              FRONTEND_HOST="${TEST_NAME}-frontend.dynamo-system.svc.cluster.local"

              # The model this Job benchmarks. MODEL is empty when the workflow
              # passes no model input, so this test's own default is applied here,
              # by the shell, where `:-` means something -- envsubst does not
              # implement it. The result is held under a DIFFERENT name because
              # every `$MODEL` in this script is substituted at render time (MODEL
              # is in envsubst's variable list) and would arrive already empty;
              # `$MODEL_PATH` is not in that list, so it survives to the shell.
              MODEL_PATH="${MODEL:-Qwen/Qwen3-VL-8B-Instruct}"

              # Anything this Job wants in the run artifact goes in $ARTIFACT_DIR.
              # save_artifacts prints each file into this pod's log between
              # "@@ci-artifact-begin <name>" and "@@ci-artifact-end <name>" lines;
              # the workflow's "Stage all logs for upload" step cuts them back out
              # into bench/<name> in the artifact. The log is the only way out: the
              # pod has exited before the workflow collects, and POD_LOG_DIR, the
              # drop box this used to copy into, was never set or mounted.
              # Called on every exit path via the trap below, and again right after
              # the curl test so the transcript is already in the log if what
              # follows is killed outright (a SIGKILL runs no trap); the workflow
              # keeps the last copy.
              ARTIFACT_DIR=/tmp/ci-artifacts
              mkdir -p "$ARTIFACT_DIR"
              save_artifacts() {
                for f in "$ARTIFACT_DIR"/*; do
                  [ -f "$f" ] || continue
                  name=$(basename "$f")
                  case "$name" in
                    *.png)
                      # Binary: base64 here, decoded by the workflow.
                      echo "@@ci-artifact-begin-b64 $name"
                      base64 "$f"
                      ;;
                    *)
                      echo "@@ci-artifact-begin $name"
                      cat "$f"
                      # An end marker glued onto an unterminated last line is lost.
                      if [ -n "$(tail -c1 "$f")" ]; then echo; fi
                      ;;
                  esac
                  echo "@@ci-artifact-end $name"
                done
              }
              trap save_artifacts EXIT

              echo "========================================="
              echo "Endpoint and FrontEnd Health Check"
              echo "========================================="

              # Wait for all worker endpoints (encode, prefill, decode) for this deployment
              echo "Waiting for all worker endpoints (encode, prefill, decode) to be registered..."
              timeout_sec=600
              poll_sec=30
              max_attempts=$((timeout_sec / poll_sec))
              workers_ready=false
              for attempt in $(seq 1 "$max_attempts"); do
                health_response=$(curl --noproxy '*' -sS "http://${FRONTEND_HOST}:${FRONTEND_PORT}/health" 2>/dev/null || echo "")

                # Check for all three required workers for epd-3way-2node deployment
                has_encode=$(echo "$health_response" | grep -c "${TEST_NAME}.*encode.generate" || true)
                has_prefill=$(echo "$health_response" | grep -c "${TEST_NAME}.*prefill.generate" || true)
                has_decode=$(echo "$health_response" | grep -c "${TEST_NAME}.*backend.generate" || true)
                frontend_status=$(echo "$health_response" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")

                if [ "$has_encode" -gt 0 ] && [ "$has_prefill" -gt 0 ] && [ "$has_decode" -gt 0 ] && [ "$frontend_status" = "healthy" ]; 
                then
                  echo "All worker endpoints registered (attempt ${attempt}/${max_attempts})"
                  echo "Registered endpoints for epd-3way-2node:"
                  echo "$health_response" | grep "${TEST_NAME}" | grep -E "encode.generate|prefill.generate|backend.generate" || true
                  workers_ready=true
                  break
                fi
                echo "Attempt ${attempt}/${max_attempts}: waiting for all workers"
                echo "Status: encode=$has_encode, prefill=$has_prefill, decode=$has_decode"
                sleep "$poll_sec"
              done

              if [ "$workers_ready" != "true" ]; then
                echo "ERROR: timeout waiting for all worker endpoints"
                echo "Final status: encode=$has_encode, prefill=$has_prefill, decode=$has_decode, frontend_status=$frontend_status"
                echo "Final health check response:"
                curl --noproxy '*' -sS "http://${FRONTEND_HOST}:${FRONTEND_PORT}/health" || true
                exit 1
              fi

              # Wait for model to be discoverable via /v1/models before starting benchmark to avoid test instability
              echo "========================================="
              echo "Model Registration Check"
              echo "========================================="

              model_ready=false
              timeout_sec=300
              poll_sec=15
              max_attempts=$((timeout_sec / poll_sec))
              for attempt in $(seq 1 "$max_attempts"); do
                if curl --noproxy '*' -sf "http://${FRONTEND_HOST}:${FRONTEND_PORT}/v1/models" 2>/dev/null | grep -Fq '"id":"'; then
                  echo "Model registration check passed (attempt ${attempt}/${max_attempts})"
                  model_ready=true
                  break
                fi
                echo "Attempt ${attempt}/${max_attempts}: model not registered yet"
                sleep "$poll_sec"
              done

              if [ "$model_ready" != "true" ]; then
                echo "ERROR: timeout waiting for model registration"
                curl --noproxy '*' -sS "http://${FRONTEND_HOST}:${FRONTEND_PORT}/v1/models" || true
                exit 1
              fi

              # Redirect curl test output to separate log file (and console)
              {
                echo "========================================="
                echo "Curl Smoke Test - $(date)"
                echo "========================================="
                echo ""

                echo "--- /v1/models ---"
                curl --noproxy '*' -sS "http://${FRONTEND_HOST}:${FRONTEND_PORT}/v1/models"
                echo ""

                echo "--- /v1/chat/completions (multimodal with retry) ---"
              } 2>&1 | tee "$ARTIFACT_DIR/curl_test.log"

              # The request goes on the wire from this one variable, so the
              # logged prompt cannot drift from what was actually sent.
              ENDPOINT="http://${FRONTEND_HOST}:${FRONTEND_PORT}/v1/chat/completions"
              REQUEST_BODY="{
                \"model\": \"${MODEL_PATH}\",
                \"messages\": [
                  {
                    \"role\": \"user\",
                    \"content\": [
                      {
                        \"type\": \"image_url\",
                        \"image_url\": {
                          \"url\": \"https://qianwen-res.oss-cn-beijing.aliyuncs.com/Qwen-VL/assets/demo.jpeg\"
                        }
                      },
                      {
                        \"type\": \"text\",
                        \"text\": \"Describe what you see in this image.\"
                      }
                    ]
                  }
                ],
                \"max_tokens\": 256,
                \"temperature\": 0.7
              }"
              echo "--- request sent to the frontend ---"
              {
                echo "endpoint: POST $ENDPOINT"
                echo "request body:"
                printf '%s\n' "$REQUEST_BODY"
              } | tee "$ARTIFACT_DIR/input-prompt-curl-req.log"

              # A known-good answer, so a reader can judge the real response without
              # fetching demo.jpeg. Prose is reference only; the expected-keywords:
              # line is enforced (3 of 10 loose terms = did the image arrive at all).
              {
                echo ""
                echo "sample-expected-response:"
                echo "This image captures a heartwarming and serene moment between a woman and her golden retriever on a sandy beach at what appears to be sunrise or sunset. The warm, golden light of the sun, low on the horizon, bathes the scene in a soft, glowing light, creating a peaceful and intimate atmosphere."
                echo ""
                echo "The woman, with long dark hair, is sitting cross-legged on the sand, wearing a blue and white plaid shirt over dark pants. She is smiling warmly as she gently holds her dog’s front paw in her hand, engaging in a \"high-five\" or hand-shake gesture. The golden retriever, wearing a colorful, patterned harness, sits attentively facing her, lifting its paw to meet hers in a playful and affectionate interaction. The dog's expression is calm and focused on her."
                echo ""
                echo "They are positioned in the foreground on soft, textured sand, with gentle waves lapping at the shore in the background and the vast ocean stretching to the horizon under a bright, hazy sky. The overall mood is one of companionship, joy, and tranquility, emphasizing the deep bond between human and pet in a beautiful natural setting."
                echo ""
                echo "expected-keywords: min 3 of dog, beach, sand, woman, ocean, shore, paw, retriever, waves, harness"
              } >> "$ARTIFACT_DIR/input-prompt-curl-req.log"
              echo "sample-expected-response and expected-keywords appended to $ARTIFACT_DIR/input-prompt-curl-req.log"

              multimodal_success=false
              multimodal_timeout=180
              multimodal_interval=15
              multimodal_max_attempts=$((multimodal_timeout / multimodal_interval))
              {
                for attempt in $(seq 1 "$multimodal_max_attempts"); do
                  echo "Multimodal request attempt ${attempt}/${multimodal_max_attempts}..."
                  response=$(curl --noproxy '*' -sS -X POST "$ENDPOINT" \
                    -H "Content-Type: application/json" \
                    -d "$REQUEST_BODY" 2>&1)

                  echo "$response"
                  # The response body itself, not just the transcript, so the
                  # artifact carries something machine-readable. Last attempt wins.
                  printf '%s\n' "$response" > "$ARTIFACT_DIR/curl_response.json"

                  # Check if response contains error indicators
                  if echo "$response" | grep -qE 'missing field|Decode worker received multimodal request without prefill result|Service Unavailable'; then
                    echo "Multimodal attempt ${attempt} failed (pipeline not ready), retrying in ${multimodal_interval}s..."
                    sleep "$multimodal_interval"
                  else
                    echo "Multimodal request completed (attempt ${attempt}/${multimodal_max_attempts})"
                    multimodal_success=true
                    break
                  fi
                done

                if [ "$multimodal_success" != "true" ]; then
                  echo "WARNING: multimodal curl request failed after ${multimodal_max_attempts} attempts"
                fi
                echo ""
                echo "Curl smoke test complete"
              } 2>&1 | tee -a "$ARTIFACT_DIR/curl_test.log"

              echo ""
              echo "========================================="
              echo "Curl test completed (logs saved to $ARTIFACT_DIR/curl_test.log)"
              echo "========================================="
              save_artifacts

              echo ""
              echo "========================================="
              echo "Running EPD 3-Way 2-Node Benchmark"
              echo "========================================="
              echo ""
              echo "Configuration:"
              echo "  FRONTEND_HOST: $FRONTEND_HOST"
              echo "  FRONTEND_PORT: ${FRONTEND_PORT}"
              echo "  MODEL: ${MODEL_PATH}"
              echo "  ISL: ${ISL}"
              echo "  OSL: ${OSL}"
              echo "  CONC: ${CONC}"
              echo "  NUM_PROMPTS: ${NUM_PROMPTS}"
              echo "  NUM_MEDIA_PER_REQ: ${NUM_MEDIA_PER_REQ}"
              echo "  REQUEST_RATE: ${REQUEST_RATE}"
              echo ""

              # The exact command line and the benchmark's output each become their
              # own file in the run artifact (bench/bench_serve-command.txt,
              # bench/bench_serve.log), cut out of this pod's log at the marker
              # lines below. The argument list is built once with `set --`, so the
              # saved command cannot drift from the one that runs. Arguments with
              # anything beyond [A-Za-z0-9_./:=,-] are single-quoted, so the saved
              # line pastes back into a shell as is.
              set -- vllm bench serve \
                --backend openai-chat \
                --base-url "http://$FRONTEND_HOST:$FRONTEND_PORT" \
                --endpoint /v1/chat/completions \
                --model "$MODEL_PATH" \
                --dataset-name random-mm \
                --tokenizer "$MODEL_PATH" \
                --num-prompts "$NUM_PROMPTS" \
                --random-input-len "$ISL" \
                --random-output-len "$OSL" \
                --random-mm-base-items-per-request "$NUM_MEDIA_PER_REQ" \
                --random-mm-bucket-config "{(480, 854, 1): 1.0}" \
                --random-mm-num-mm-items-range-ratio 0.0 \
                --max-concurrency "$CONC" \
                --request-rate "$REQUEST_RATE" \
                --ready-check-timeout-sec 120 \
                --percentile-metrics ttft,tpot,itl,e2el \
                --metric-percentiles 50,90,99 \
                --ignore-eos
              echo "@@ci-artifact-begin bench_serve-command.txt"
              for arg in "$@"; do
                case "$arg" in
                  *[!A-Za-z0-9_./:=,-]*) printf "'%s' " "$arg" ;;
                  *) printf '%s ' "$arg" ;;
                esac
              done
              echo
              echo "@@ci-artifact-end bench_serve-command.txt"
              echo "@@ci-artifact-begin bench_serve.log"
              "$@"
              echo "@@ci-artifact-end bench_serve.log"

              echo ""
              echo "========================================="
              echo "Benchmark Complete"
              echo "========================================="
          env:
            - name: FRONTEND_PORT
              value: "8000"
            - name: MODEL
              value: "$MODEL"
            - name: ISL
              value: "6300"
            - name: OSL
              value: "380"
            - name: CONC
              value: "8"
            - name: NUM_PROMPTS
              value: "160"
            - name: NUM_MEDIA_PER_REQ
              value: "20"
            - name: REQUEST_RATE
              value: "inf"
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/hub
            - name: HF_HUB_OFFLINE
              value: "0"
          volumeMounts:
            - name: pytorch-models
              mountPath: /models
            - name: weka-models
              mountPath: /mnt/weka
              readOnly: true
