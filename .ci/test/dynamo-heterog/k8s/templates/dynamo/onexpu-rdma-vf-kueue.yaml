# ResourceClaimTemplate for 1 Intel GPU (XPU) + 1 SR-IOV VF of the cabled ConnectX NIC.
#
# onexpu-rdma-kueue.yaml with the rdma request moved from the physical port
# (PF, one per node) to a virtual function (VF) of it. The PF can go to one pod
# only (dranet moves the netdev into that pod's netns); the VFs are separate
# RDMA devices on the same cable, so each pod gets its own. For px-dx, which
# runs two NIXL workers (Prefill + Decode) on the XPU node.
#
# Device class: rdma-dranet-mlx5-vf-up (deviceclass-rdma-dranet-mlx5-vf-up.yaml).
#
# Kueue accounting (kueue-queues.yaml): intel.com/xpu=1, intel.com/rdma=1 --
# only once rdma-dranet-mlx5-vf-up is listed under intel.com/rdma in
# kueue-manager-config's deviceClassMappings.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: onexpu-rdma-vf-kueue
  namespace: dynamo-system
spec:
  spec:
    devices:
      requests:
        - name: xpu
          exactly:
            allocationMode: ExactCount
            count: 1
            deviceClassName: gpu.intel.com
        - name: rdma
          exactly:
            allocationMode: ExactCount
            count: 1
            deviceClassName: rdma-dranet-mlx5-vf-up


# kubectl apply -n dynamo-system -f onexpu-rdma-vf-kueue.yaml

# kubectl get resourceclaimtemplate -n dynamo-system onexpu-rdma-vf-kueue -o jsonpath='{range .spec.spec.devices.requests[*]}{.name}{" -> "}{.exactly.count}{" x "}{.exactly.deviceClassName}{"\n"}{end}'
