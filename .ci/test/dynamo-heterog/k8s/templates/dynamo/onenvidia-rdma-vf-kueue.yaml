# ResourceClaimTemplate for 1 NVIDIA GPU + 1 SR-IOV VF of the cabled ConnectX-5.
#
# onenvidia-rdma-kueue.yaml with the rdma request moved from the physical port
# (PF 0000:2e:00.0, one per node) to a virtual function (VF) of it
# (0000:2e:00.2-.5 on sc09super16-a100). The PF can go to one pod only (dranet
# moves the netdev into that pod's netns); the VFs are separate RDMA devices on
# the same cable, so each pod gets its own. For the tests that run two NIXL
# workers on the NVIDIA node:
#   epd_3way_2node.yaml  Prefill + Dec
#   omni_ar-dit_2nodes   Ar + Router
#
# Device class: rdma-dranet-mlx5-vf-up (deviceclass-rdma-dranet-mlx5-vf-up.yaml).
#
# Kueue accounting (kueue-queues.yaml): nvidia.com/gpu=1, intel.com/rdma=1 --
# only once rdma-dranet-mlx5-vf-up is listed under intel.com/rdma in
# kueue-manager-config's deviceClassMappings.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: onenvidia-rdma-vf-kueue
  namespace: dynamo-system
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            allocationMode: ExactCount
            count: 1
            deviceClassName: gpu.nvidia.com
        - name: rdma
          exactly:
            allocationMode: ExactCount
            count: 1
            deviceClassName: rdma-dranet-mlx5-vf-up


# kubectl apply -n dynamo-system -f onenvidia-rdma-vf-kueue.yaml

# kubectl get resourceclaimtemplate -n dynamo-system onenvidia-rdma-vf-kueue -o jsonpath='{range .spec.spec.devices.requests[*]}{.name}{" -> "}{.exactly.count}{" x "}{.exactly.deviceClassName}{"\n"}{end}'
